<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 930" width="1160" height="930" role="img" aria-labelledby="title desc">
<title id="title">5단계 서비스 구성</title><desc id="desc">브라우저 인증과 메모 요청은 Vercel 서버를 거칩니다. 직접 DB 권한은 회수했고, 심판 운영 요청은 별도 미확인입니다.</desc>
<rect width="1160" height="930" fill="white"/>
<defs>
<marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#275b91"/></marker>
<marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#8492a3"/></marker>
<marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#ab463c"/></marker>
</defs>
<g font-family="Malgun Gothic, Segoe UI, sans-serif" fill="#203147">
<rect x="30" y="40" width="240" height="105" rx="10" fill="#edf4fb" stroke="#93b2ce" stroke-width="1.4"/>
<text x="150.0" y="72.5" text-anchor="middle" font-size="18" font-weight="600">Vercel 정적 화면</text>
<text x="150.0" y="97.5" text-anchor="middle" font-size="14" font-weight="400">index.html · /aleph.json</text>
<text x="150.0" y="122.5" text-anchor="middle" font-size="14" font-weight="400">nosniff · 공개 data.json 제외</text>
<rect x="30" y="200" width="240" height="190" rx="10" fill="#edf4fb" stroke="#93b2ce" stroke-width="1.4"/>
<text x="150.0" y="250.0" text-anchor="middle" font-size="18" font-weight="600">브라우저 · Auth SDK</text>
<text x="150.0" y="275.0" text-anchor="middle" font-size="14" font-weight="400">메모 CRUD 화면</text>
<text x="150.0" y="300.0" text-anchor="middle" font-size="14" font-weight="400">세션 토큰은 브라우저에 존재</text>
<text x="150.0" y="325.0" text-anchor="middle" font-size="14" font-weight="400">실제 공개 키는 제거</text>
<text x="150.0" y="350.0" text-anchor="middle" font-size="14" font-weight="400">HttpOnly 쿠키로 바꾼 작업 아님</text>
<rect x="30" y="450" width="240" height="105" rx="10" fill="#f3f5f8" stroke="#a0acb8" stroke-width="1.4"/>
<text x="150.0" y="482.5" text-anchor="middle" font-size="18" font-weight="600">CDN · 공식 SDK</text>
<text x="150.0" y="507.5" text-anchor="middle" font-size="14" font-weight="400">정적 import로 로드</text>
<text x="150.0" y="532.5" text-anchor="middle" font-size="14" font-weight="400">실제 정적 파일 검사 범위</text>
<rect x="360" y="200" width="330" height="110" rx="10" fill="#edf4fb" stroke="#93b2ce" stroke-width="1.4"/>
<text x="525.0" y="235.0" text-anchor="middle" font-size="18" font-weight="600">/api/auth · 신규</text>
<text x="525.0" y="260.0" text-anchor="middle" font-size="14" font-weight="400">token · user · logout만 전달</text>
<text x="525.0" y="285.0" text-anchor="middle" font-size="14" font-weight="400">서버에서 키 사용 · 응답 최소화</text>
<rect x="360" y="450" width="330" height="150" rx="10" fill="#edf4fb" stroke="#93b2ce" stroke-width="1.4"/>
<text x="525.0" y="492.5" text-anchor="middle" font-size="18" font-weight="600">/api/notes · /api/notes/:id</text>
<text x="525.0" y="517.5" text-anchor="middle" font-size="14" font-weight="400">기존 메모 CRUD 유지</text>
<text x="525.0" y="542.5" text-anchor="middle" font-size="14" font-weight="400">verify-login → 학생 getUser 확인</text>
<text x="525.0" y="567.5" text-anchor="middle" font-size="14" font-weight="400">검증 사용자 ID로 소유자 제한</text>
<rect x="820" y="200" width="280" height="110" rx="10" fill="#edf7f1" stroke="#8fbaa3" stroke-width="1.4"/>
<text x="960.0" y="235.0" text-anchor="middle" font-size="18" font-weight="600">Supabase Auth</text>
<text x="960.0" y="260.0" text-anchor="middle" font-size="14" font-weight="400">토큰 발급·갱신·사용자 확인</text>
<text x="960.0" y="285.0" text-anchor="middle" font-size="14" font-weight="400">서버 Auth / 학생 인증 경로</text>
<rect x="820" y="450" width="280" height="150" rx="10" fill="#edf7f1" stroke="#8fbaa3" stroke-width="1.4"/>
<text x="960.0" y="492.5" text-anchor="middle" font-size="18" font-weight="600">Supabase Data API → DB</text>
<text x="960.0" y="517.5" text-anchor="middle" font-size="14" font-weight="400">/rest/v1/library_notes</text>
<text x="960.0" y="542.5" text-anchor="middle" font-size="14" font-weight="400">서버 service_role CRUD 유지</text>
<text x="960.0" y="567.5" text-anchor="middle" font-size="14" font-weight="400">기존 RLS · 소유자 정책 유지</text>
<rect x="360" y="675" width="330" height="90" rx="10" fill="#f3f5f8" stroke="#a0acb8" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="525.0" y="700.0" text-anchor="middle" font-size="18" font-weight="600">심판 토큰 검증 · 기존 구현</text>
<text x="525.0" y="725.0" text-anchor="middle" font-size="14" font-weight="400">별도 JWKS·ES256 검증 계약</text>
<text x="525.0" y="750.0" text-anchor="middle" font-size="14" font-weight="400">운영 토큰 요청 성공은 미확인</text>
<rect x="820" y="675" width="280" height="90" rx="10" fill="#f3f5f8" stroke="#a0acb8" stroke-width="1.4"/>
<text x="960.0" y="700.0" text-anchor="middle" font-size="18" font-weight="600">사용자 · SQL Editor</text>
<text x="960.0" y="725.0" text-anchor="middle" font-size="14" font-weight="400">권한 회수 SQL 직접 실행</text>
<text x="960.0" y="750.0" text-anchor="middle" font-size="14" font-weight="400">행·다른 테이블·서버 권한 보존</text>
<polyline points="150,145 150,200" fill="none" stroke="#275b91" stroke-width="1.7" marker-end="url(#arr-blue)"/>
<polyline points="150,450 150,390" fill="none" stroke="#275b91" stroke-width="1.7" marker-end="url(#arr-blue)"/>
<text x="215" y="420" text-anchor="middle" font-size="14" fill="#275b91" stroke="white" stroke-width="5" paint-order="stroke">SDK 로드</text>
<polyline points="270,255 360,255" fill="none" stroke="#275b91" stroke-width="1.7" marker-end="url(#arr-blue)"/>
<text x="313" y="239" text-anchor="middle" font-size="14" fill="#275b91" stroke="white" stroke-width="5" paint-order="stroke">인증</text>
<polyline points="690,255 820,255" fill="none" stroke="#275b91" stroke-width="1.7" marker-end="url(#arr-blue)"/>
<text x="756" y="240" text-anchor="middle" font-size="14" fill="#275b91" stroke="white" stroke-width="5" paint-order="stroke">/auth/v1</text>
<polyline points="270,340 312,340 312,525 360,525" fill="none" stroke="#275b91" stroke-width="1.7" marker-end="url(#arr-blue)"/>
<text x="314" y="427" text-anchor="middle" font-size="14" fill="#275b91" stroke="white" stroke-width="5" paint-order="stroke">메모</text>
<polyline points="525,450 525,362 960,362 960,310" fill="none" stroke="#275b91" stroke-width="1.7" marker-end="url(#arr-blue)"/>
<text x="738" y="344" text-anchor="middle" font-size="14" fill="#275b91" stroke="white" stroke-width="5" paint-order="stroke">학생 세션·사용자 검증</text>
<polyline points="690,525 820,525" fill="none" stroke="#275b91" stroke-width="1.7" marker-end="url(#arr-blue)"/>
<text x="754" y="510" text-anchor="middle" font-size="14" fill="#275b91" stroke="white" stroke-width="5" paint-order="stroke">서버 키</text>
<polyline points="525,675 525,600" fill="none" stroke="#8492a3" stroke-width="1.7" marker-end="url(#arr-grey)" stroke-dasharray="6 4"/>
<text x="617" y="642" text-anchor="middle" font-size="14" fill="#8492a3" stroke="white" stroke-width="5" paint-order="stroke">기존 별도 경로</text>
<polyline points="960,675 960,600" fill="none" stroke="#8492a3" stroke-width="1.7" marker-end="url(#arr-grey)" stroke-dasharray="6 4"/>
<text x="1036" y="642" text-anchor="middle" font-size="14" fill="#8492a3" stroke="white" stroke-width="5" paint-order="stroke">검토 후 적용</text>
<polyline points="30,300 12,300 12,823 1130,823 1130,555 1100,555" fill="none" stroke="#ab463c" stroke-width="1.7" marker-end="url(#arr-red)" stroke-dasharray="6 4"/>
<text x="645" y="853" text-anchor="middle" font-size="14" fill="#ab463c" stroke="white" stroke-width="5" paint-order="stroke">공개 키 + 계정 토큰 직접 GET·PATCH → 403 (사용자 제공 결과)</text>
<text x="580" y="900" text-anchor="middle" font-size="14" fill="#627083">5단계 완료 기준 · 자동 갱신 실제 만료 시험 / 심판 운영 요청은 미확인 · XDR은 별도 범위</text></g></svg>