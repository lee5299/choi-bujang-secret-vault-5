<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a28">
  <title>BYTE BACK | 탈환 작전실 로그인</title>
  <link rel="icon" href="/icons/vault-192.png" type="image/png">
  <link rel="stylesheet" href="/operations.css">
  <script src="/device-client.js" defer></script>
  <script type="module" src="/operations-entry.mjs"></script>
</head>
<body>
  <main id="operations-login">
    <nav><a href="/">자료실로 돌아가기</a><a href="/operations-public.html">공개 요약 보기</a></nav>
    <p class="eyebrow">BYTE BACK · 관리자 전용</p>
    <h1>탈환 작전실 로그인</h1>
    <p>작전실 전용 페이지입니다. 관리자 로그인과 승인 기기 확인 후 입장할 수 있습니다.</p>
    <p>로그인 정보는 이 페이지의 메모리에만 두며, 페이지를 다시 열면 다시 로그인합니다.</p>
    <section class="auth" aria-labelledby="auth-heading">
      <h2 id="auth-heading">관리자 로그인</h2>
      <p id="auth-status" role="status">로그인 상태를 확인하는 중입니다.</p>
      <form id="login-form">
        <fieldset id="login-fields" disabled>
          <label for="login-email">이메일<input id="login-email" type="email" autocomplete="username" required></label>
          <label for="login-password">비밀번호<input id="login-password" type="password" autocomplete="current-password" required></label>
          <button type="submit">로그인</button>
        </fieldset>
      </form>
      <button id="logout-button" type="button" hidden>로그아웃</button>
      <p id="auth-error" role="alert"></p>
    </section>
    <section id="device-panel" class="auth" hidden aria-labelledby="device-heading">
      <h2 id="device-heading">승인 기기 확인</h2>
      <p id="device-status" role="status">관리자 로그인 후 기기를 확인하세요.</p>
      <div class="actions">
        <button id="device-register" type="button">기기 승인 요청</button>
        <button id="device-verify" type="button">승인된 기기 확인</button>
        <button id="device-refresh" type="button">승인 상태 새로고침</button>
      </div>
      <button id="operations-enter" type="button" disabled>탈환 작전실 입장</button>
    </section>
  </main>
  <div id="operations-outlet" hidden></div>
</body>
</html>
